# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sync_engine_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:admin}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
spring.jpa.open-in-view=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# --- Server ---
server.port=8080

# --- Actuator & Observability ---
# Expose health, metrics, and prometheus scrape endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Tag all metrics with application and environment name
management.metrics.tags.application=sync-engine
management.metrics.tags.environment=production