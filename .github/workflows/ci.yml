name: Sync Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Check out repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up JDK 21 using setup-java@v5 with Maven caching
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Ensure Maven Wrapper has execution permissions
      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      # 4. Build, run unit tests, and run integration tests with Testcontainers
      - name: Build and Verify with Maven
        run: ./mvnw clean verify -B --no-transfer-progress

      # 5. Diagnostic step: Print test failure logs if any test ever fails
      - name: Print Test Failures (if any)
        if: failure()
        run: |
          echo "=== SUREFIRE UNIT TEST REPORTS ==="
          grep -rn "FAILURE!" target/surefire-reports/ || true
          grep -rn "ERROR!" target/surefire-reports/ || true
          echo "=== FAILSAFE INTEGRATION TEST REPORTS ==="
          grep -rn "FAILURE!" target/failsafe-reports/ || true
          grep -rn "ERROR!" target/failsafe-reports/ || true

      # 6. Archive JaCoCo Coverage HTML Report
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      # 7. Publish CI Summary to GitHub Run Summary Page
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### 🚀 CI Build & Verification Completed" >> $GITHUB_STEP_SUMMARY
          if [ -d target/site/jacoco ]; then
            echo "✅ **JaCoCo Coverage Report generated successfully.**" >> $GITHUB_STEP_SUMMARY
            echo "You can download the full interactive HTML report from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          fi