
name: Sync Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Check out repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up JDK 21 with Maven caching
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Ensure Maven Wrapper has execution permissions
      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      # 4. Build, run tests, and generate coverage
      - name: Build and Verify with Maven
        run: ./mvnw clean verify -B --no-transfer-progress

      # 5. Verify the Docker image builds cleanly
      - name: Build Docker Image
        run: docker build -t sync-engine:ci .

      # 6. Print test failure logs if any step fails
      - name: Print Test Failures (if any)
        if: failure()
        run: |
          echo "=== SUREFIRE UNIT TEST REPORTS ==="
          grep -rn "FAILURE!" target/surefire-reports/ || true
          grep -rn "ERROR!" target/surefire-reports/ || true
          echo "=== FAILSAFE INTEGRATION TEST REPORTS ==="
          grep -rn "FAILURE!" target/failsafe-reports/ || true
          grep -rn "ERROR!" target/failsafe-reports/ || true

      # 7. Archive JaCoCo Coverage HTML Report
      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      # 8. Publish CI Summary
      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "### CI Build & Verification Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -d target/site/jacoco ]; then
            echo "JaCoCo coverage report generated." >> "$GITHUB_STEP_SUMMARY"
            echo "Download the HTML report from the Artifacts section." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "JaCoCo coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
